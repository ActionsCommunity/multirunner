# Hosted jobs are secret-free and run for every pull request, including forks.
# Privileged provisioning runs only on manual or scheduled trusted revisions.
#
# Repository setup for privileged runs:
# MR_CONFORMANCE_TARGETS variable:
# [{"repository":"ActionsCommunity/multirunner","ref":"main"},{"repository":"owner/second-target","ref":"main"}]
# MR_CONFORMANCE_PAT secret: fine-grained token with Actions:write and
# Administration:write on only those targets. Never grant source write access.
# MR_WINDOWS_HOST_RUNS_ON variable: JSON labels for a trusted Windows container
# host, for example ["self-hosted","windows","multirunner-host"].
# Each external target needs runner-conformance-dispatch.yml on its selected ref.
# A complete scheduled matrix and its uploaded reports are the release gate.
name: runner-conformance

on:
  pull_request:
    paths:
      - ".github/workflows/runner-conformance*.yml"
      - "testdata/conformance/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-conformance*.yml"
      - "testdata/conformance/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: testdata/conformance/node/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: testdata/conformance/node/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: testdata/conformance/python/uv.lock
      - name: Validate workflows and fixtures
        run: |
          set -euo pipefail
          go test ./testdata/conformance/... -count=1
          pnpm --dir testdata/conformance/node install --frozen-lockfile
          pnpm --dir testdata/conformance/node test
          (
            cd testdata/conformance/python
            uv run --locked python -m unittest discover -s tests
          )

  hosted-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: testdata/conformance/node/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: testdata/conformance/node/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: testdata/conformance/dotnet/**/packages.lock.json
      - name: Validate Node and .NET fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir testdata/conformance/node install --frozen-lockfile
          pnpm --dir testdata/conformance/node test
          dotnet restore testdata/conformance/dotnet/Conformance.slnx --locked-mode
          dotnet restore testdata/conformance/dotnet/src/Conformance/Conformance.csproj `
            --runtime win-x64 --locked-mode
          dotnet build testdata/conformance/dotnet/Conformance.slnx `
            --configuration Release --no-restore
          dotnet test testdata/conformance/dotnet/Conformance.slnx `
            --configuration Release --no-build --no-restore
          dotnet publish testdata/conformance/dotnet/src/Conformance/Conformance.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore --output "$env:RUNNER_TEMP/conformance-publish"
          $output = & "$env:RUNNER_TEMP/conformance-publish/Conformance.exe"
          if ($output -ne 'ActionsCommunity/multirunner:windows:ok') {
              throw "unexpected published artifact output: $output"
          }

  privileged-linux:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.MR_CONFORMANCE_TARGETS != ''
    uses: ./.github/workflows/runner-conformance-host.yml
    with:
      platform: linux
      host_runs_on: '["ubuntu-latest"]'
      backend: docker
      docker_host: unix:///var/run/docker.sock
      image: gerardsmit/multirunner-runner-linux:node
      targets_json: ${{ vars.MR_CONFORMANCE_TARGETS }}
      fixture_repository: ${{ github.repository }}
      fixture_ref: ${{ github.sha }}
      cache_modes_json: '["disabled","enabled"]'
      queue_limit_seconds: 180
    secrets:
      MR_CONFORMANCE_PAT: ${{ secrets.MR_CONFORMANCE_PAT }}

  privileged-windows:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.MR_CONFORMANCE_TARGETS != '' &&
      vars.MR_WINDOWS_HOST_RUNS_ON != ''
    uses: ./.github/workflows/runner-conformance-host.yml
    with:
      platform: windows
      host_runs_on: ${{ vars.MR_WINDOWS_HOST_RUNS_ON }}
      backend: ${{ vars.MR_WINDOWS_BACKEND || 'containerd' }}
      docker_host: ${{ vars.MR_WINDOWS_DOCKER_HOST || 'npipe:////./pipe/containerd-containerd' }}
      image: gerardsmit/multirunner-runner-windows:dotnet
      targets_json: ${{ vars.MR_CONFORMANCE_TARGETS }}
      fixture_repository: ${{ github.repository }}
      fixture_ref: ${{ github.sha }}
      cache_modes_json: '["disabled","enabled"]'
      queue_limit_seconds: 300
    secrets:
      MR_CONFORMANCE_PAT: ${{ secrets.MR_CONFORMANCE_PAT }}
