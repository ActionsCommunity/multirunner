# Privileged runner conformance extends the original e2e-linux entry point.
# It has no pull request trigger and runs only trusted repository revisions.
#
# Privileged setup:
# MR_E2E_PAT secret: fine-grained token with Actions:write,
# Administration:write, and Contents:read on only the target repositories.
# MR_CONFORMANCE_TARGETS variable:
# [{"repository":"ActionsCommunity/multirunner","ref":"main"},{"repository":"owner/second-target","ref":"main"}]
# MR_CONFORMANCE_TRUSTED_REF variable: trusted branch ref, defaults to
# refs/heads/main. Manual dispatches from any other ref fail before token use.
# MR_WINDOWS_HOST_RUNS_ON variable: JSON labels for a trusted Windows container
# host, for example ["self-hosted","windows","multirunner-host"].
# Each target must install this repository's e2e-target.yml on its selected
# protected branch.
# A complete scheduled matrix and its uploaded reports are the release gate.
name: e2e-linux

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-conformance-privileged
  cancel-in-progress: false

jobs:
  privileged-linux:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'ActionsCommunity/multirunner' &&
      github.ref == (vars.MR_CONFORMANCE_TRUSTED_REF || 'refs/heads/main') &&
      vars.MR_CONFORMANCE_TARGETS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [disabled, enabled]
    env:
      MR_TARGETS: ${{ vars.MR_CONFORMANCE_TARGETS }}
      MR_PLATFORM: linux
      MR_BACKEND: docker
      MR_DOCKER_HOST: unix:///var/run/docker.sock
      MR_IMAGE: gerardsmit/multirunner-runner-linux:node
      MR_RUNNER_LABEL: mr-conformance-linux-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_RUNNER_PREFIX: mr-conformance-linux-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_REPORT: runner-conformance-linux-${{ matrix.cache_mode }}.json
      MR_CACHE_MODE: ${{ matrix.cache_mode }}
      MR_QUEUE_LIMIT: 3m
      MR_TRUSTED_REF: ${{ vars.MR_CONFORMANCE_TRUSTED_REF || 'refs/heads/main' }}
      DOCKER_HOST: unix:///var/run/docker.sock
    steps: &privileged_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build conformance binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          go build -o "multirunner$extension" ./cmd/multirunner
          go build -o "conformance-orchestrator$extension" ./testdata/conformance/orchestrator

      - name: Validate trusted configuration
        shell: pwsh
        env:
          MR_CONFORMANCE_PAT: ${{ secrets.MR_E2E_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MR_CONFORMANCE_PAT)) {
              throw "MR_E2E_PAT is missing. Configure the least-privilege target token."
          }
          Write-Output "::add-mask::$env:MR_CONFORMANCE_PAT"
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "./conformance-orchestrator$extension" validate

      - name: Write multirunner configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @($env:MR_TARGETS | ConvertFrom-Json)
          $cacheEnabled = ($env:MR_CACHE_MODE -eq 'enabled').ToString().ToLowerInvariant()
          $cachePath = (
              Join-Path $env:RUNNER_TEMP "multirunner-cache-$env:MR_CACHE_MODE-$env:GITHUB_RUN_ID"
          ).Replace('\', '/')
          $config = @('github:', '  scope: repos', '  repos:')
          $config += $targets | ForEach-Object { "    - `"$($_.repository)`"" }
          $config += @(
              'auth:',
              '  pat: ${MR_CONFORMANCE_PAT}',
              'provisioning: autoscale',
              'webhook:',
              '  poll_interval_sec: 5',
              'cache:',
              "  enabled: $cacheEnabled",
              '  mode: local-server',
              "  path: `"$cachePath`"",
              '  advertise_url: "http://host.docker.internal:3000"',
              'git_cache:',
              '  mode: "off"',
              'pools:',
              '  - name: conformance',
              "    os: $env:MR_PLATFORM",
              "    backend: $env:MR_BACKEND",
              "    size: $($targets.Count)",
              "    image: `"$env:MR_IMAGE`"",
              "    labels: [self-hosted, $env:MR_PLATFORM, x64, $env:MR_RUNNER_LABEL]",
              "    name_prefix: `"$env:MR_RUNNER_PREFIX`"",
              '    docker:',
              "      host: `"$env:MR_DOCKER_HOST`"",
              'log:',
              '  level: debug',
              '  format: text'
          )
          $config | Set-Content -Encoding utf8NoBOM multirunner-conformance.yaml

      - name: Start multirunner
        shell: pwsh
        env:
          MR_CONFORMANCE_PAT: ${{ secrets.MR_E2E_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $process = Start-Process `
            -FilePath (Resolve-Path "./multirunner$extension") `
            -ArgumentList @('run', '--config', 'multirunner-conformance.yaml') `
            -RedirectStandardOutput multirunner.stdout.log `
            -RedirectStandardError multirunner.stderr.log `
            -PassThru
          $process.Id | Set-Content multirunner.pid
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
              throw "multirunner exited during startup"
          }

      - name: Dispatch and verify target workloads
        shell: pwsh
        env:
          MR_CONFORMANCE_PAT: ${{ secrets.MR_E2E_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "./conformance-orchestrator$extension" run

      - name: Stop multirunner and sanitize logs
        if: always()
        shell: pwsh
        env:
          MR_CONFORMANCE_PAT: ${{ secrets.MR_E2E_PAT }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path multirunner.pid) {
              $processID = [int](Get-Content multirunner.pid)
              Stop-Process -Id $processID -ErrorAction SilentlyContinue
              Wait-Process -Id $processID -Timeout 30 -ErrorAction SilentlyContinue
          }
          foreach ($path in @('multirunner.stdout.log', 'multirunner.stderr.log')) {
              if (Test-Path $path) {
                  $content = Get-Content $path -Raw
                  if (-not [string]::IsNullOrEmpty($env:MR_CONFORMANCE_PAT)) {
                      $content = $content.Replace($env:MR_CONFORMANCE_PAT, '[REDACTED]')
                  }
                  $content | Set-Content -Encoding utf8NoBOM $path
                  Get-Content $path
              }
          }

      - name: Verify owned resource cleanup
        if: always()
        shell: pwsh
        env:
          MR_CONFORMANCE_PAT: ${{ secrets.MR_E2E_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "./conformance-orchestrator$extension" cleanup

          if ($env:MR_BACKEND -eq 'containerd') {
              $names = @(& nerdctl --namespace multirunner ps --all --format '{{.Names}}')
          } else {
              $names = @(& docker ps --all --filter label=multirunner=true --format '{{.Names}}')
          }
          if ($LASTEXITCODE -ne 0) {
              throw "container inventory command failed"
          }
          $owned = @($names | Where-Object { $_.StartsWith($env:MR_RUNNER_PREFIX, [StringComparison]::Ordinal) })
          if ($owned.Count -ne 0) {
              throw "owned containers remain: $($owned -join ',')"
          }
          "phase=cleanup containers=0 prefix=$env:MR_RUNNER_PREFIX"

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-${{ env.MR_PLATFORM }}-${{ matrix.cache_mode }}-${{ github.run_id }}
          path: |
            ${{ env.MR_REPORT }}
            multirunner.stdout.log
            multirunner.stderr.log
          if-no-files-found: warn

  privileged-windows:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'ActionsCommunity/multirunner' &&
      github.ref == (vars.MR_CONFORMANCE_TRUSTED_REF || 'refs/heads/main') &&
      vars.MR_CONFORMANCE_TARGETS != '' &&
      vars.MR_WINDOWS_HOST_RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.MR_WINDOWS_HOST_RUNS_ON) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cache_mode: [disabled, enabled]
    env:
      MR_TARGETS: ${{ vars.MR_CONFORMANCE_TARGETS }}
      MR_PLATFORM: windows
      MR_BACKEND: containerd
      MR_DOCKER_HOST: ${{ vars.MR_WINDOWS_DOCKER_HOST || 'npipe:////./pipe/containerd-containerd' }}
      MR_IMAGE: gerardsmit/multirunner-runner-windows:dotnet
      MR_RUNNER_LABEL: mr-conformance-windows-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_RUNNER_PREFIX: mr-conformance-windows-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_REPORT: runner-conformance-windows-${{ matrix.cache_mode }}.json
      MR_CACHE_MODE: ${{ matrix.cache_mode }}
      MR_QUEUE_LIMIT: 5m
      MR_TRUSTED_REF: ${{ vars.MR_CONFORMANCE_TRUSTED_REF || 'refs/heads/main' }}
      DOCKER_HOST: ${{ vars.MR_WINDOWS_DOCKER_HOST || 'npipe:////./pipe/containerd-containerd' }}
    steps: *privileged_steps
