name: console

on:
  push:
    branches: [main]
    paths:
      - "apps/console/**"
      - "internal/consoleui/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "apps/console/**"
      - "internal/consoleui/**"
      - ".github/workflows/console.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/console/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate console
        run: |
          set -euo pipefail
          pnpm --dir apps/console install --frozen-lockfile
          pnpm --dir apps/console exec playwright install --with-deps chromium
          pnpm --dir apps/console check
          pnpm --dir apps/console test:coverage
          go test -coverprofile="$RUNNER_TEMP/console-go.cover" \
            ./internal/consoleauth ./internal/consoleapi ./internal/control \
            ./internal/history ./internal/operations ./internal/restore \
            ./internal/runtimecontrol
          coverage="$(go tool cover -func="$RUNNER_TEMP/console-go.cover" |
            awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage + 0 < 61.0) {
              printf "Go console coverage %.1f%% is below 61.0%%\n", coverage
              exit 1
            }
          }'
          go test ./internal/consoleui
          git diff --exit-code -- apps/console/src/styles/tokens.css internal/consoleui/dist
