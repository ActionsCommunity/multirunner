# Reusable trusted orchestrator. Callers choose the host labels and backend.
# The token needs Actions:write and Administration:write on every target only.
# MR_CONFORMANCE_TARGETS is JSON:
# [{"repository":"owner/repo-one","ref":"main"},{"repository":"owner/repo-two","ref":"main"}]
name: runner-conformance-host

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      host_runs_on:
        required: true
        type: string
      backend:
        required: true
        type: string
      docker_host:
        required: true
        type: string
      image:
        required: true
        type: string
      targets_json:
        required: true
        type: string
      target_workflow:
        required: false
        type: string
        default: runner-conformance-dispatch.yml
      fixture_repository:
        required: true
        type: string
      fixture_ref:
        required: true
        type: string
      cache_modes_json:
        required: false
        type: string
        default: '["disabled","enabled"]'
      queue_limit_seconds:
        required: false
        type: number
        default: 180
    secrets:
      MR_CONFORMANCE_PAT:
        required: true

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ${{ fromJSON(inputs.host_runs_on) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cache_mode: ${{ fromJSON(inputs.cache_modes_json) }}
    env:
      MR_CONFORMANCE_PAT: ${{ secrets.MR_CONFORMANCE_PAT }}
      MR_TARGETS: ${{ inputs.targets_json }}
      MR_PLATFORM: ${{ inputs.platform }}
      MR_BACKEND: ${{ inputs.backend }}
      MR_DOCKER_HOST: ${{ inputs.docker_host }}
      MR_IMAGE: ${{ inputs.image }}
      MR_RUNNER_LABEL: mr-conformance-${{ inputs.platform }}-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_RUNNER_PREFIX: mr-conformance-${{ inputs.platform }}-${{ matrix.cache_mode }}-${{ github.run_id }}
      MR_REPORT: runner-conformance-${{ inputs.platform }}-${{ matrix.cache_mode }}.json
      DOCKER_HOST: ${{ inputs.docker_host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate trusted configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MR_CONFORMANCE_PAT)) {
              throw "MR_CONFORMANCE_PAT is missing. Configure the least-privilege target token."
          }
          $targets = @($env:MR_TARGETS | ConvertFrom-Json)
          if ($targets.Count -lt 2) {
              throw "MR_CONFORMANCE_TARGETS must contain at least two repositories."
          }
          foreach ($target in $targets) {
              if ($target.repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
                  throw "invalid target repository"
              }
              if ([string]::IsNullOrWhiteSpace($target.ref)) {
                  throw "every target needs a ref"
              }
          }
          if ($env:MR_PLATFORM -notin @('linux', 'windows')) {
              throw "platform must be linux or windows"
          }
          if ($env:MR_BACKEND -notin @('docker', 'containerd')) {
              throw "backend must be docker or containerd"
          }

      - name: Build conformance binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          go build -o "multirunner$extension" ./cmd/multirunner
          go build -o "conformance-orchestrator$extension" ./testdata/conformance/orchestrator

      - name: Write multirunner configuration
        shell: pwsh
        env:
          CACHE_MODE: ${{ matrix.cache_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @($env:MR_TARGETS | ConvertFrom-Json)
          $repositoryLines = ($targets | ForEach-Object { "    - `"$($_.repository)`"" }) -join "`n"
          $cacheEnabled = ($env:CACHE_MODE -eq 'enabled').ToString().ToLowerInvariant()
          $cachePath = (Join-Path $env:RUNNER_TEMP "multirunner-cache-$env:CACHE_MODE").Replace('\', '/')
          $config = @"
          github:
            scope: repos
            repos:
          $repositoryLines
          auth:
            pat: `${MR_CONFORMANCE_PAT}
          provisioning: autoscale
          webhook:
            poll_interval_sec: 5
          cache:
            enabled: $cacheEnabled
            mode: local-server
            path: "$cachePath"
            advertise_url: "http://host.docker.internal:3000"
          git_cache:
            mode: "off"
          pools:
            - name: conformance
              os: $env:MR_PLATFORM
              backend: $env:MR_BACKEND
              size: $($targets.Count)
              image: "$env:MR_IMAGE"
              labels: [self-hosted, $env:MR_PLATFORM, x64, $env:MR_RUNNER_LABEL]
              name_prefix: "$env:MR_RUNNER_PREFIX"
              docker:
                host: "$env:MR_DOCKER_HOST"
          log:
            level: debug
            format: text
          "@
          $config | Set-Content -Encoding utf8NoBOM multirunner-conformance.yaml

      - name: Start multirunner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $process = Start-Process `
            -FilePath (Resolve-Path "./multirunner$extension") `
            -ArgumentList @('run', '--config', 'multirunner-conformance.yaml') `
            -RedirectStandardOutput multirunner.stdout.log `
            -RedirectStandardError multirunner.stderr.log `
            -PassThru
          $process.Id | Set-Content multirunner.pid
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
              Get-Content multirunner.stdout.log, multirunner.stderr.log
              throw "multirunner exited during startup"
          }

      - name: Dispatch and verify target workloads
        shell: pwsh
        env:
          CACHE_MODE: ${{ matrix.cache_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "./conformance-orchestrator$extension" run `
            --targets-json $env:MR_TARGETS `
            --workflow '${{ inputs.target_workflow }}' `
            --runner-label $env:MR_RUNNER_LABEL `
            --runner-prefix $env:MR_RUNNER_PREFIX `
            --fixture-repository '${{ inputs.fixture_repository }}' `
            --fixture-ref '${{ inputs.fixture_ref }}' `
            --platform $env:MR_PLATFORM `
            --cache-mode $env:CACHE_MODE `
            --queue-limit '${{ inputs.queue_limit_seconds }}s' `
            --report $env:MR_REPORT

      - name: Stop multirunner
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path multirunner.pid) {
              $processID = [int](Get-Content multirunner.pid)
              Stop-Process -Id $processID -ErrorAction SilentlyContinue
              Wait-Process -Id $processID -Timeout 30 -ErrorAction SilentlyContinue
          }
          Get-Content multirunner.stdout.log, multirunner.stderr.log -ErrorAction SilentlyContinue

      - name: Verify owned resource cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "./conformance-orchestrator$extension" cleanup `
            --targets-json $env:MR_TARGETS `
            --runner-prefix $env:MR_RUNNER_PREFIX

          if ($env:MR_BACKEND -eq 'containerd') {
              $names = @(& nerdctl --namespace multirunner ps --all --format '{{.Names}}')
          } else {
              $names = @(& docker ps --all --filter label=multirunner=true --format '{{.Names}}')
          }
          if ($LASTEXITCODE -ne 0) {
              throw "container inventory command failed"
          }
          $owned = @($names | Where-Object { $_.StartsWith($env:MR_RUNNER_PREFIX, [StringComparison]::Ordinal) })
          if ($owned.Count -ne 0) {
              throw "owned containers remain: $($owned -join ',')"
          }
          "phase=cleanup containers=0 prefix=$env:MR_RUNNER_PREFIX"

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-${{ inputs.platform }}-${{ matrix.cache_mode }}-${{ github.run_id }}
          path: |
            ${{ env.MR_REPORT }}
            multirunner.stdout.log
            multirunner.stderr.log
          if-no-files-found: warn
