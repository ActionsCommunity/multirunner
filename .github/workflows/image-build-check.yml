name: image-build-check

# Validates that the runner image flavors build (and the toolchains work) on PRs
# touching the image files — without pushing. Uses plain `docker build` so the
# layered chain resolves locally even before flavor tags are published.

on:
  pull_request:
    paths:
      - "images/**"
      - ".gitattributes"
      - ".github/actions/**"
      - ".github/workflows/image-build-check.yml"
      - ".github/workflows/images.yml"
      - ".github/workflows/update-image-versions.yml"
      - "cmd/update-image-versions/**"
      - "internal/winvm/bake.go"
  workflow_dispatch:

jobs:
  version-policy:
    runs-on: ubuntu-latest
    outputs:
      buildtools-lines: ${{ steps.buildtools-lines.outputs.lines }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Build Tools release lines
        id: buildtools-lines
        run: |
          set -euo pipefail
          lines=$(jq -c '.buildtools.lines | keys' images/versions.json)
          # Without this, a jq failure produces an empty matrix and every
          # Build Tools image silently goes unbuilt.
          printf '%s' "$lines" | jq -e 'type == "array" and length > 0' >/dev/null
          echo "lines=$lines" >> "$GITHUB_OUTPUT"

      - name: Reject end-of-life Node majors and .NET channels
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          expired=$(jq -r --arg today "$today" '
            [ (.node.releases   | to_entries[] | select(.value.eol < $today) | "Node major \(.key) reached end of life on \(.value.eol)"),
              (.dotnet.channels | to_entries[] | select(.value.eol < $today) | ".NET channel \(.key) reached end of life on \(.value.eol)")
            ] | .[]' images/versions.json)
          if [ -z "$expired" ]; then
            echo "All declared Node majors and .NET channels are supported"
            exit 0
          fi
          while IFS= read -r entry; do
            echo "::error title=End-of-life runtime declared::$entry. Remove it from images/versions.json, or retain it explicitly by extending the declared eol date."
          done <<< "$expired"
          exit 1

      - name: Require image targets for newly supported .NET channels
        run: |
          set -euo pipefail
          count=$(jq '.dotnet.unassigned_supported_channels | length' images/versions.json)
          if [ "$count" -eq 0 ]; then
            echo "All supported .NET channels have image targets"
            exit 0
          fi

          jq -r '.dotnet.unassigned_supported_channels[] |
            "::error title=Assign .NET image targets::Channel \(.channel) is \(.release_type) / \(.support_phase), latest SDK \(.latest_sdk), EOL \(.eol). Move it into dotnet.channels and select linux, windows-container, and/or qemu-windows targets."' \
            images/versions.json
          exit 1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build flavor chain (no push, host arch)
        run: |
          set -euo pipefail
          B=mr-check-linux
          docker build -f images/linux/Dockerfile -t $B:minimal .
          docker build -f images/linux/flavors/native-build.Dockerfile --build-arg PARENT=$B:minimal -t $B:native-build .
          docker build -f images/linux/flavors/node.Dockerfile         --build-arg PARENT=$B:native-build -t $B:node .
          docker build -f images/linux/flavors/dotnet.Dockerfile       --build-arg PARENT=$B:node          -t $B:dotnet .
          docker build -f images/linux/flavors/rust.Dockerfile         --build-arg PARENT=$B:node          -t $B:rust .
          docker build -f images/linux/flavors/go.Dockerfile           --build-arg PARENT=$B:native-build  -t $B:go .

      - name: Smoke-test toolchains
        run: |
          set -euo pipefail
          B=mr-check-linux
          docker run --rm --entrypoint bash $B:native-build -lc '
            set -eu
            printf "#include <openssl/ssl.h>\nint main(void){return OPENSSL_VERSION_NUMBER == 0;}\n" > probe.c
            gcc probe.c -lssl -lcrypto -o probe
            printf "#include <unicode/utypes.h>\nint main(void){return U_ICU_VERSION_MAJOR_NUM == 0;}\n" > probe.c
            gcc probe.c $(pkg-config --cflags --libs icu-uc) -o probe
            printf "#include <sql.h>\n#include <libpq-fe.h>\nint main(void){return 0;}\n" > probe.c
            gcc probe.c -I$(pg_config --includedir) -lodbc -lpq -o probe
            mkdir autotools-probe && cd autotools-probe
            printf "AC_INIT([probe],[1.0])\nAM_INIT_AUTOMAKE([foreign])\nAC_PROG_CC\nAC_CONFIG_FILES([Makefile])\nAC_OUTPUT\n" > configure.ac
            printf "bin_PROGRAMS = probe\nprobe_SOURCES = probe.c\n" > Makefile.am
            printf "int main(void){return 0;}\n" > probe.c
            autoreconf -fi && ./configure && make
          '
          docker run --rm --entrypoint bash $B:node          -lc '
            set -eu
            cache_dir=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
            test -x "$cache_dir/bin/node"
            test -f "$cache_dir.complete"
            test "$(stat -c %U "$cache_dir")" = runner
            "$cache_dir/bin/node" --version
            corepack --version
          '
          docker run --rm --entrypoint bash $B:dotnet        -lc 'dotnet --list-sdks && node --version'
          docker run --rm --entrypoint bash $B:rust          -lc 'rustc --version && cargo --version'
          docker run --rm --entrypoint bash $B:go            -lc 'go version'

      # The cache-redirect patch must live ONLY in the sidecar. If it leaks into
      # the live DLL, ACTIONS_RESULTS_URL is unset whenever cache.enabled is false
      # and actions/upload-artifact fails with "Unable to get the
      # ACTIONS_RESULTS_URL env variable".
      - name: Verify cache patch is sidecar-only
        run: |
          set -euo pipefail
          B=mr-check-linux
          docker run --rm --entrypoint bash $B:minimal -lc '
            set -eu
            grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.L" bin/Runner.Worker.dll
            grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.X" bin/Runner.Worker.dll.mrpatched
            ! grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.X" bin/Runner.Worker.dll
          '

      - name: Exercise cache patch entrypoint modes
        run: |
          set -euo pipefail
          B=mr-check-linux
          for mode in stock patched; do
            args=(-e JIT_CONFIG=invalid)
            if [ "$mode" = patched ]; then
              args+=(-e ACTIONS_RESULTS_URL=http://cache.invalid/)
            fi
            id=$(docker create "${args[@]}" "$B:minimal")
            docker start -a "$id" || true
            docker cp "$id:/home/runner/bin/Runner.Worker.dll" "runner-worker-$mode.dll"
            docker rm "$id"
          done
          grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.L" runner-worker-stock.dll
          if grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.X" runner-worker-stock.dll; then exit 1; fi
          grep -qa "A.C.T.I.O.N.S._.R.E.S.U.L.T.S._.U.R.X" runner-worker-patched.dll
          rm runner-worker-stock.dll runner-worker-patched.dll

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build and run arm64 node flavor
        run: |
          set -euo pipefail
          B=mr-check-linux-arm64
          docker build --platform linux/arm64 -f images/linux/Dockerfile -t $B:minimal .
          docker build --platform linux/arm64 -f images/linux/flavors/native-build.Dockerfile --build-arg PARENT=$B:minimal -t $B:native-build .
          docker build --platform linux/arm64 -f images/linux/flavors/node.Dockerfile --build-arg PARENT=$B:native-build -t $B:node .
          docker run --rm --platform linux/arm64 --entrypoint bash $B:node -lc '
            set -eu
            cache_dir=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
            case "$cache_dir" in */arm64) ;; *) echo "unexpected cache path: $cache_dir"; exit 1 ;; esac
            test -x "$cache_dir/bin/node"
            test -f "$cache_dir.complete"
            node --version
          '

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-docker

      # Windows images are large, so keep this job to the Node/.NET branch.
      # Build Tools release lines run on separate clean runners below because
      # Windows container layer deletion does not reliably return disk space.
      - name: Build minimal
        shell: bash
        run: |
          set -euo pipefail
          B=mr-check-windows
          docker build -f images/windows/Dockerfile -t $B:minimal .
          df -h / || true

      - name: Build and assert node + dotnet, then reclaim
        shell: bash
        run: |
          set -euo pipefail
          B=mr-check-windows
          docker build -f images/windows/flavors/node.Dockerfile   --build-arg "PARENT=$B:minimal" -t $B:node .
          docker build -f images/windows/flavors/dotnet.Dockerfile --build-arg "PARENT=$B:node"    -t $B:dotnet .

          # `where` also proves the machine PATH edits survived into a fresh
          # container, which is what jobs calling node/dotnet directly rely on.
          docker run --rm --entrypoint cmd $B:node   /c "where node && where npm && node --version"
          docker run --rm --entrypoint cmd $B:dotnet /c "where dotnet && dotnet --list-sdks && node --version"
          NODE_VERSIONS="$(node -e "const v=require('./images/versions.json'); console.log(Object.values(v.node.releases).map(r => r.version).join(' '))")"
          # One assertion per cmd invocation: cmd folds an `&&` chain after
          # `if not exist X exit 1` into the IF body, so chained checks never
          # run when the first path exists.
          for version in $NODE_VERSIONS; do
            docker run --rm --entrypoint cmd $B:node /s /c \
              "if not exist C:/hostedtoolcache/windows/node/$version/x64/node.exe exit 1"
            docker run --rm --entrypoint cmd $B:node /s /c \
              "if not exist C:/hostedtoolcache/windows/node/$version/x64.complete exit 1"
          done

          # Docker's default escape character is `\`, so an unescaped
          # `ENV X=C:\foo` silently becomes `C:foo`. Assert the real values.
          docker run --rm --entrypoint cmd $B:dotnet /c \
            "if not \"%RUNNER_TOOL_CACHE%\"==\"C:\\hostedtoolcache\\windows\" exit 1"
          docker run --rm --entrypoint cmd $B:dotnet /c \
            "if not \"%DOTNET_ROOT%\"==\"C:\\dotnet\" exit 1"

          # Reclaim the derived branch before the minimal-image smoke tests.
          docker rmi -f $B:dotnet $B:node
          docker builder prune -af
          docker image prune -f
          df -h / || true

      # The cache-redirect patch must live ONLY in the sidecar. If it leaks into
      # the live DLL, ACTIONS_RESULTS_URL is unset whenever cache.enabled is false
      # and actions/upload-artifact fails with "Unable to get the
      # ACTIONS_RESULTS_URL env variable".
      #
      # Scan bytes, not decoded text: the UTF-16LE literal sits at an odd file
      # offset, so reading the DLL as UTF-16 from byte 0 never finds it.
      - name: Verify cache patch is sidecar-only
        shell: pwsh
        run: |
          $script = @'
          function Test-Lit([string]$Path, [string]$S) {
              $b = [IO.File]::ReadAllBytes($Path)
              $q = [Text.Encoding]::Unicode.GetBytes($S)
              for ($i = 0; $i -le $b.Length - $q.Length; $i++) {
                  $m = $true
                  for ($j = 0; $j -lt $q.Length; $j++) { if ($b[$i+$j] -ne $q[$j]) { $m = $false; break } }
                  if ($m) { return $true }
              }
              return $false
          }
          $dll = 'C:\actions-runner\bin\Runner.Worker.dll'
          if (-not (Test-Lit $dll 'ACTIONS_RESULTS_URL')) { throw 'stock DLL was patched' }
          if (Test-Lit $dll 'ACTIONS_RESULTS_URX') { throw 'stock DLL was patched' }
          if (-not (Test-Lit ($dll + '.mrpatched') 'ACTIONS_RESULTS_URX')) { throw 'sidecar not patched' }
          'sidecar-only OK'
          '@
          docker run --rm --entrypoint pwsh mr-check-windows:minimal -NoProfile -Command $script

      - name: Exercise cache patch entrypoint modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in 'stock', 'patched') {
              $args = @('create', '--env', 'JIT_CONFIG=invalid')
              if ($mode -eq 'patched') {
                  $args += @('--env', 'ACTIONS_RESULTS_URL=http://cache.invalid/')
              }
              $args += 'mr-check-windows:minimal'
              $id = (& docker @args).Trim()
              & cmd /c "docker start --attach $id || ver > nul"
              & docker cp "${id}:C:\actions-runner\bin\Runner.Worker.dll" ".\runner-worker-$mode.dll"
              if ($LASTEXITCODE -ne 0) { throw "docker cp failed for $mode mode" }
              & docker rm $id
              if ($LASTEXITCODE -ne 0) { throw "docker rm failed for $mode mode" }
          }

          function Test-Lit([string]$Path, [string]$S) {
              $b = [IO.File]::ReadAllBytes($Path)
              $q = [Text.Encoding]::Unicode.GetBytes($S)
              for ($i = 0; $i -le $b.Length - $q.Length; $i++) {
                  $m = $true
                  for ($j = 0; $j -lt $q.Length; $j++) {
                      if ($b[$i+$j] -ne $q[$j]) { $m = $false; break }
                  }
                  if ($m) { return $true }
              }
              return $false
          }
          if (-not (Test-Lit .\runner-worker-stock.dll 'ACTIONS_RESULTS_URL')) { throw 'stock entrypoint mode was patched' }
          if (Test-Lit .\runner-worker-stock.dll 'ACTIONS_RESULTS_URX') { throw 'stock entrypoint mode was patched' }
          if (-not (Test-Lit .\runner-worker-patched.dll 'ACTIONS_RESULTS_URX')) { throw 'redirect entrypoint mode was not patched' }
          Remove-Item .\runner-worker-stock.dll, .\runner-worker-patched.dll

      - name: Smoke-test shells on PATH
        shell: bash
        run: |
          set -euo pipefail
          B=mr-check-windows
          # pwsh is the default shell for `run:` steps on Windows in GitHub
          # Actions, so it must resolve on PATH or `shell: pwsh` steps fail.
          docker run --rm --entrypoint cmd $B:minimal /c "where pwsh && where git"
          docker run --rm --entrypoint pwsh $B:minimal -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

  windows-buildtools:
    name: windows-buildtools-${{ matrix.line }}
    needs: version-policy
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.version-policy.outputs.buildtools-lines) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim host Visual Studio disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
              'C:\Program Files\Microsoft Visual Studio\18\Enterprise',
              'C:\ProgramData\Microsoft\VisualStudio\Packages'
          )
          foreach ($expected in $targets) {
              $target = [IO.Path]::GetFullPath($expected).TrimEnd('\')
              if ($target -cne $expected -or $target.Length -lt 40) {
                  throw "unsafe cleanup target: $target"
              }
              if (-not (Test-Path -LiteralPath $target)) { continue }
              $item = Get-Item -LiteralPath $target -Force
              if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw "cleanup target is not a real directory: $target"
              }
              Write-Host "Removing ephemeral runner directory $target"
              Remove-Item -LiteralPath $target -Recurse -Force
          }
          $free = (Get-PSDrive -Name C).Free
          Write-Host ("Free disk after cleanup: {0:N1} GB" -f ($free / 1GB))
          if ($free -lt 35GB) { throw 'less than 35 GB free after guarded cleanup' }

      - uses: ./.github/actions/wait-for-docker

      - name: Build minimal and assert Build Tools ${{ matrix.line }}
        shell: bash
        run: |
          set -euo pipefail
          B=mr-check-windows-buildtools-${{ matrix.line }}
          docker build -f images/windows/Dockerfile -t "$B:minimal" .
          docker build -f images/windows/flavors/buildtools.Dockerfile \
            --build-arg "PARENT=$B:minimal" \
            --build-arg "BUILDTOOLS_LINE=${{ matrix.line }}" \
            -t "$B:buildtools" .
          docker run --rm --entrypoint powershell "$B:buildtools" -NoProfile -Command \
            "& 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath"
          # Separate cmd invocations: chaining `&&` after `if not ... exit 1`
          # puts the whole chain inside the IF body, so the dev-cmd checks
          # would only ever run on the failure branch.
          docker run --rm --entrypoint cmd "$B:buildtools" /s /c \
            "if not \"%VSBUILDTOOLS%\"==\"C:\BuildTools\" exit 1"
          docker run --rm --entrypoint cmd "$B:buildtools" /s /c \
            "call \"%VSBUILDTOOLS%\Common7\Tools\VsDevCmd.bat\" && where cl && msbuild -version"
