# multirunner — parallel ephemeral GitHub Actions self-hosted runners on one host.

github:
  url: "https://github.com"      # change for GHES
  scope: "org"                   # repo | repos | org | enterprise
  owner: "myorg"                 # org name (org) | repo owner (repo/repos) | enterprise slug (enterprise)
  repo: "myrepo"                 # only for scope=repo
  # repos:                       # only for scope=repos (multiple repos, one instance)
  #   - repo-one                 # uses owner above
  #   - repo-two                 # uses owner above
  #   - otheruser/repo-three     # explicit owner (cross-account requires PAT auth)

auth:
  pat: "${GITHUB_PAT}"           # ${ENV} refs are resolved from the environment (keeps secrets off disk)
  #                                scopes: admin:org (org) / repo (repo) / manage_runners:enterprise
  # GitHub App (recommended for shared/production — short-lived, not user-tied).
  # With scope=repos, every repo must be covered by this one installation account.
  # app_id: 123456
  # installation_id: 78901234
  # private_key_path: "C:/path/app.pem"

provisioning: "pool"             # pool | autoscale | scaleset  (webhook = alias for autoscale)
#   pool      : keep N runners idle (zero inbound; works behind NAT) — default
#   autoscale : launch runners on demand (poll queued jobs + optional webhook)
#   scaleset  : let GitHub drive capacity through a runner scale set. A long-poll
#               session reports the desired runner count, so assignments arrive in
#               seconds with no poll interval to tune and no inbound endpoint.
#               This is the same mechanism actions-runner-controller uses.
#               Needs scope repo, org or enterprise, and a `scale_set` per pool.

# Autoscale tuning (provisioning: autoscale). Polling is outbound-only (NAT-safe)
# and works for scope=repo or repos; the optional webhook needs GitHub to reach `listen`
# (public IP or a tunnel: smee.io / cloudflared / ngrok).
webhook:
  listen: ""                     # e.g. "0.0.0.0:8080" to enable the webhook receiver
  path: "/webhook"
  secret: "${GITHUB_WEBHOOK_SECRET}"   # App webhook secret; `connect` does not save or activate it
  poll_interval_sec: 300         # queued-job poll interval (repo/repos); -1 disables

# Prometheus metrics + /health (empty disables)
metrics:
  listen: ""                     # e.g. "127.0.0.1:9090" -> /metrics, /health

git_cache:
  mode: "off"                    # mirror | dotgit-cache | off  (wired for scope=repo)
  path: "D:/multirunner/gitmirror"
  max_age_days: 30               # remove mirrors unused this many days (0 => 30; <0 => never)

cache:
  enabled: true
  mode: "local-server"           # local-server (own Go v2) | off
  storage: "filesystem"          # only implemented embedded storage
  path: "D:/multirunner/cache"
  listen: "0.0.0.0:3000"
  # URL of this cache as seen from INSIDE runner containers (host.docker.internal
  # for Docker, host.containers.internal for Podman). Injected as ACTIONS_RESULTS_URL.
  advertise_url: "http://host.docker.internal:3000"
  # Set external_url to use an existing cache server instead of starting the
  # embedded server. The URL must be reachable from the runner containers.
  # external_url: "http://cache.internal:3000/_mr/<token>"
  # Optional private path token. Embedded cache generates one automatically and
  # injects it into runners; set this only when coordinating with an external
  # standalone cacheserver's --access-token.
  access_token: "${MULTIRUNNER_CACHE_ACCESS_TOKEN}"
  skip_token_validation: true    # path token gates access; accept opaque/missing Actions bearer
  upstream: "https://results-receiver.actions.githubusercontent.com"
  # Housekeeping: evict cache entries unused for max_age_days, and LRU-evict to
  # keep total blob size under max_size_gb (0 => unlimited). gc_interval_sec sets
  # the sweep cadence; <0 disables GC entirely.
  max_age_days: 7                # 0 => 7; <0 => never expire
  max_size_gb: 0                 # 0 => unlimited
  gc_interval_sec: 3600          # 0 => 3600; <0 => disabled

pools:
  - name: linux-pool
    os: linux
    size: 3
    runner_group_id: 1
    # image_tier picks a prebuilt flavor (pulled automatically):
    #   minimal (default) | native-build | node | dotnet | rust | go
    # or set image: to use your own. dotnet/rust already bundle Node.
    # Tip: `multirunner detect --path .` recommends flavors for a repo.
    image_tier: minimal
    # image: "ghcr.io/my-org/custom-runner:latest"
    labels: [self-hosted, linux, x64]
    work_folder: _work
    name_prefix: multirunner
    container:
      cpus: 2
      # Memory values use mebibytes (MiB).
      memory_mb: 4096
      # Total memory plus swap in MiB. Equal to memory_mb to disable swap.
      memory_swap_mb: 4096
      dns: [1.1.1.1, 8.8.8.8]
    # Required when provisioning: scaleset. Each pool needs its own scale set,
    # because a scale set carries one label set and therefore one runner OS.
    # The name is reused across restarts, so restarting does not churn
    # registrations or strand jobs already queued against it.
    # scale_set: "multirunner-linux"
    # runner_group: "Default"
    docker:
      # WSL2 Docker Engine over TCP, OR Podman/Docker-Desktop docker-compat pipe:
      #   npipe:////./pipe/docker_engine
      host: "tcp://127.0.0.1:2375"
      enable_dind: false          # trusted Linux jobs only: mounts the host Docker socket
    tool_cache:
      mode: "shared-volume"
      volume: "mr-toolcache-linux"
      readonly: true
    max_consecutive_failures: 5

  # Flavor pool example: a .NET + Node image, selected from a workflow with
  #   runs-on: [self-hosted, linux, dotnet]
  - name: linux-dotnet
    os: linux
    size: 2
    image_tier: dotnet
    labels: [self-hosted, linux, dotnet]
    docker:
      host: "tcp://127.0.0.1:2375"

  # Windows runners on a LINUX host via a QEMU VM (golden Server Core image +
  # per-job copy-on-write overlay). Build the golden image first: multirunner bake.
  - name: windows-vm-pool
    os: windows
    backend: qemu                # docker (default) | qemu
    size: 2
    runner_group_id: 1
    labels: [self-hosted, windows, x64]
    qemu:
      golden: "/var/lib/multirunner/golden-servercore.qcow2"
      work_dir: "/var/lib/multirunner/vm" # dedicated: real run/service start (not doctor) attempts top-level artifact cleanup
      mem_mb: 4096
      cpus: 2
      accel: ""                  # auto: x64 uses kvm/whpx/hvf; ARM uses slower x86 TCG emulation
      # bake_iso enables automatic rebuilds. Its content is always part of the
      # golden fingerprint; set bake_iso_sha256 to also reject unexpected media.
      # bake_iso: "/var/lib/multirunner/WinServer2022.iso"
      # bake_iso_sha256: "<64 lowercase hex characters>"
      # runner_version: "2.337.0"
      # A custom runner_version needs runner_sha256 for bake or managed rebuilds.
      # runner_sha256: "<64 lowercase hex characters>"
      # licensed: true             # skip evaluation-license housekeeping for activated images
      # Toolchains baked into the golden (the VM equivalent of image_tier; qemu
      # ignores image/image_tier). Options: dotnet | dotnet:<major> | node |
      # node:<major> | go | buildtools | buildtools:<line>. A bare selector
      # follows images/versions.json (every LTS Node major, the qemu-windows
      # .NET channels, the default Build Tools line); exact selectors combine.
      # Match `multirunner bake --tools ...`. With bake_iso configured, tool drift can
      # trigger a later startup rebuild; otherwise bake the changed golden explicitly.
      # Two Build Tools lines are two full Visual Studio installs: bake with a
      # --disk-gb well above the 40 GB default.
      # tools: [dotnet, "node:24", "buildtools:17", "buildtools:18"]

  - name: windows-pool
    os: windows
    size: 2
    runner_group_id: 1
    # For containerd/runhcs, set backend: containerd and configure this block:
    # backend: containerd
    # containerd:
    #   address: '\\.\pipe\containerd-containerd'
    #   nerdctl: "nerdctl.exe"
    #   namespace: "multirunner"
    #   isolation: auto            # process | hyperv | auto
    #   Per-container DNS is not supported by nerdctl on Windows. Remove
    #   container.dns when selecting this backend.
    # Windows image_tier options (pulled automatically):
    #   minimal (default) | node | dotnet | buildtools | buildtools:17 | buildtools:18
    # dotnet layers on node, so it already bundles Node. buildtools layers on
    # minimal and adds the MSVC toolchain for native C/C++; the unqualified
    # tier aliases the default_line in images/versions.json, and each
    # buildtools:<line> is its own published image.
    image_tier: minimal
    labels: [self-hosted, windows, x64]
    work_folder: _work
    # Windows containers support CPU, memory, and DNS. Swap is Linux-only.
    container:
      cpus: 2
      # Memory values use mebibytes (MiB).
      memory_mb: 4096
      dns: [1.1.1.1, 8.8.8.8]
    docker:
      host: "npipe:////./pipe/docker_engine_windows"
      isolation: auto            # auto (default): process on Server, hyperv on client
      windows_dind: "off"        # unused; no Windows DinD mode is implemented
    max_consecutive_failures: 5

log:
  level: info                    # debug | info | warn | error
  format: text                   # text | json
